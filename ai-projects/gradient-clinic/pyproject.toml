[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-clinic"
version = "0.1.0"
description = "Diagnostic laboratory for neural-network training dynamics"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]